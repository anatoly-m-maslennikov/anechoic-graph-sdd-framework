[project]
name = "anechoic-engine"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
runtime = [
    "mcp==2.3.0",
    "pydantic==2.14.4",
    "PyYAML==6.0.3",
    "jsonschema>=4.23,<5",
    "duckdb==2.0.0",
    "markdown-it-py==4.2.0",
    "pytz>=2026.6",
    "toon-format==1.0.0",
    "watchdog==6.0.0",
    "dulwich==1.2.21",
]
dev = [
    {include-group = "runtime"},
    "ruff==0.16.8",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
]
http-contract-tests = [
    "httpx==0.28.1",
    "hypothesis==6.170.17",
    "openapi-spec-validator==0.9.0",
    "pytest==9.0.2",
    "schemathesis==4.10.1",
]

[tool.ruff]
target-version = "py314"
line-length = 79
cache-dir = ".anechoic_tmp/python/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
cache_dir = ".anechoic_tmp/python/mypy"
explicit_package_bases = true
mypy_path = [
  "LAYER_4_ENGINE_STUDIO_C14",
]
files = [
  "LAYER_4_ENGINE_STUDIO_C14/FEATURE_PROGRAMMATIC/FEATURE_TOOLS/header_yaml.py",
  "LAYER_4_ENGINE_STUDIO_C14/FEATURE_PROGRAMMATIC/FEATURE_TOOLS/ADAPTERS_C30/carrier_compat__pub.py",
]
follow_imports = "silent"

[tool.anechoic.test_suite]
