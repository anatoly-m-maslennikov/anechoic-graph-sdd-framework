[tool.pytest.ini_options]
# Keep pytest's disposable cache and atomic staging inside project temporary state.
cache_dir = ".anechoic_tmp/cache/pytest"

[tool.uv]
cache-dir = ".anechoic_tmp/cache/uv"


[dependency-groups]
typing = ["ruff==0.16.8", "mypy==2.3.1", "types-PyYAML==6.0.12.20260906"]
rmed-workflow-mcp = ["mcp==2.3.0", "PyYAML==6.0.3", "jsonschema>=4.23,<5", {include-group = "workbench"}]
workbench = [
    "duckdb==2.0.0",
    "markdown-it-py==4.2.0",
    "pytz>=2026.6",
    "toon-format==1.0.0",
    "watchdog==6.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 79
cache-dir = ".anechoic_tmp/cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
cache_dir = ".anechoic_tmp/cache/mypy"
mypy_path = [
  "LAYER_3_ENGINE_STUDIO_C14/FEATURE_PROGRAMMATIC/FEATURE_TOOLS",
]
files = [
  "LAYER_3_ENGINE_STUDIO_C14/FEATURE_PROGRAMMATIC/FEATURE_TOOLS/header_yaml.py",
  "LAYER_3_ENGINE_STUDIO_C14/FEATURE_PROGRAMMATIC/FEATURE_TOOLS/header_groups.py",
]
follow_imports = "silent"
