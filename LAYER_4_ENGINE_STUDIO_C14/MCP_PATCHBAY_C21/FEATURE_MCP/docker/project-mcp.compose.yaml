# CA-M-322@13
# CA-D-578@21
# CA-M-551@2
x-runtime-logging: &runtime-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    mode: "non-blocking"
    max-buffer-size: "1m"

services:
  mcp-http:
    image: ${ANECHOIC_IMAGE:?An admitted immutable image is required}
    logging: *runtime-logging
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    stop_grace_period: 10s
    tmpfs: ["/tmp:size=128m,mode=1777"]
    pids_limit: 128
    mem_limit: 1536m
    cpus: 1
    command: [mcp-http]
    environment:
      ANECHOIC_RUNTIME_NAMESPACE: docker
      ANECHOIC_CONTROL_ROOT: ${ANECHOIC_CONTROL_ROOT:?Selected control root is required}
      ANECHOIC_PROJECT_INSTANCE_ID: ${ANECHOIC_PROJECT_INSTANCE_ID:?Selected identity is required}
      ANECHOIC_HOST_PROJECT_ROOT: ${ANECHOIC_PROJECT_ROOT:?Selected Project root is required}
    labels:
      org.anechoic.project: ${ANECHOIC_PROJECT_INSTANCE_ID}
      org.anechoic.runtime.fingerprint: ${ANECHOIC_RUNTIME_FINGERPRINT:?Image fingerprint is required}
      org.anechoic.service: mcp-http
      org.anechoic.control_root: ${ANECHOIC_CONTROL_ROOT}
      org.anechoic.host_project_root: ${ANECHOIC_PROJECT_ROOT}
    volumes:
      - type: bind
        source: ${ANECHOIC_PROJECT_ROOT}
        target: /project
    ports: ["127.0.0.1:${ANECHOIC_MCP_HTTP_PORT:?Project Settings HTTP port is required}:8092"]
    healthcheck:
      test: [CMD, python, -B, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8092/anechoic/health',timeout=3))['ready'] is True"]
      interval: 2s
      timeout: 5s
      retries: 25
      start_period: 420s
